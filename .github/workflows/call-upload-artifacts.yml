name: "upload-artifacts"
on:
  workflow_call:

permissions:
  contents: read

jobs:
  upload_artifacts:
    name: Build and upload ${{ matrix.id }} dist
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - id: "neoforge"
            task: ":instances:neoforge:shadowJar"
          - id: "forge"
            task: ":instances:forge:shadowJar"
          - id: "bukkit"
            task: ":instances:bukkit:shadowJar"
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read project properties
        id: properties
        uses: christian-draeger/read-properties@908f99d3334be3802ec7cb528395a69d19914e7b # 1.1.1
        with:
          path: './gradle.properties'
          properties: 'klibs.project.name'
      - name: Set up JDK
        uses: ./.github/actions/setup-jdk
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Give gradle permission
        run: chmod +x gradlew
      - name: Build ${{ matrix.id }} with Gradle
        run: ./gradlew ${{ matrix.task }} --stacktrace
      - name: Upload ${{ matrix.id }} dist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dist-${{ matrix.id }}
          # ./jars is the Gradle shadowJar output directory (see instances/*/build.gradle.kts)
          path: ./jars/${{ steps.properties.outputs.klibs-project-name }}-${{ matrix.id }}*.jar
