name: "upload-modrinth-release"
on:
  workflow_call:
    secrets:
      MODRINTH_TOKEN:
        description: "Modrinth API token used to publish the release."
        required: true

permissions:
  contents: read

jobs:
  upload_modrinth_release:
    name: Upload ${{ matrix.id }} Modrinth release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        id: [ "neoforge", "forge", "bukkit" ]
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Read project properties
        id: properties
        uses: christian-draeger/read-properties@908f99d3334be3802ec7cb528395a69d19914e7b # 1.1.1
        with:
          path: './gradle.properties'
          properties: 'klibs.project.name klibs.project.version.string'

      - name: Download ${{ matrix.id }} dist
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: dist-${{ matrix.id }}
          path: ./dist/${{ matrix.id }}
      - name: Publish ${{ matrix.id }} to Modrinth
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          modrinth-id: 6NpNwzA1
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: ${{ steps.properties.outputs.klibs-project-name }}-${{ matrix.id }}
          version: ${{ steps.properties.outputs.klibs-project-version-string }}
          changelog: ${{ join(github.event.commits.*.message, '\n') }}
          version-type: beta
          java: |
            21
          loaders: |
            ${{ matrix.id }}
          game-versions: |
            [1.16,1.21.1)
          files: |
            ./dist/${{ matrix.id }}/*.jar
