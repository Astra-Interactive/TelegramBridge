name: "version-changed"
on:
  workflow_call:

permissions:
  contents: read

jobs:
  version_changed:
    name: Validate version is changed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Checkout base branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.base_ref }}
          path: base
      - name: Read current version
        id: current
        uses: christian-draeger/read-properties@908f99d3334be3802ec7cb528395a69d19914e7b # 1.1.1
        with:
          path: './gradle.properties'
          properties: 'klibs.project.version.string'
      - name: Read base version
        id: base
        uses: christian-draeger/read-properties@908f99d3334be3802ec7cb528395a69d19914e7b # 1.1.1
        with:
          path: './base/gradle.properties'
          properties: 'klibs.project.version.string'
      - name: Check klibs.project.version.string is changed
        env:
          BASE_VERSION: ${{ steps.base.outputs.klibs-project-version-string }}
          CURRENT_VERSION: ${{ steps.current.outputs.klibs-project-version-string }}
        run: |
          echo "Base version: ${BASE_VERSION}"
          echo "Current version: ${CURRENT_VERSION}"
          if [ -z "${CURRENT_VERSION}" ] || [ "${CURRENT_VERSION}" = "${BASE_VERSION}" ]; then
            echo "::error file=gradle.properties::klibs.project.version.string is not changed (still ${CURRENT_VERSION}). Bump the version before merging."
            exit 1
          fi
