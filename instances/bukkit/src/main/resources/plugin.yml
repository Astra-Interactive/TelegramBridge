main: '${main}'
prefix: '${prefix}'
description: '${description}'
name: '${name}'
version: '${version}'
authors: [ "${authors}" ]
author: "${author}"
website: "${url}"
api-version: 1.18
softdepend: [ "luckperms" ]
depend: [ ]
loadbefore: [ ]
libraries: ${libraries}
permissions:
  tbridge.setup:
    description: Set up the Telegram and Discord bots with /mb
    default: op
  tbridge.reload:
    description: Reload the plugin with /mb reload
    default: op
  tbridge.unlink.player:
    description: Unlink the accounts of another player with /unlink <player>
    default: op
